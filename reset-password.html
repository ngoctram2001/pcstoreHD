<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password – JohnnyPC</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
  html { overflow-x: hidden; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .reset-card {
    width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 40px 36px; box-shadow: 0 20px 50px rgba(44,31,20,.08);
  }
  .reset-card h2 { font-family: 'Space Grotesk', sans-serif; text-align: center; margin-bottom: 8px; }
  .reset-card p.sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .login-field input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; outline: none;
  }
  .login-field input:focus { border-color: var(--accent); background: var(--surface); }
  .password-field-wrap { position: relative; }
  .password-field-wrap input { padding-right: 42px; }
  .password-toggle-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px;
    border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--muted); border-radius: 6px;
  }
  .password-toggle-btn:hover { color: var(--text); background: var(--surface2); }
  .login-error { font-size: 12px; color: var(--red); margin-top: 6px; display: none; }
  .reset-submit-btn {
    width: 100%; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff;
    font-family: inherit; font-size: 15px; font-weight: 700;
  }
  .reset-submit-btn:disabled { opacity: .6; cursor: not-allowed; }
  .reset-success { text-align: center; }
  .reset-success .icon { font-size: 40px; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="reset-card">
  <div id="reset-form-area">
    <h2>Set a new password</h2>
    <p class="sub">Choose a new password for your account.</p>
    <div class="login-field">
      <label>New password</label>
      <div class="password-field-wrap">
        <input type="password" id="new-password" placeholder="••••••••">
        <button class="password-toggle-btn" type="button" data-target="new-password" aria-label="Show password">👁</button>
      </div>
    </div>
    <div class="login-field">
      <label>Confirm new password</label>
      <div class="password-field-wrap">
        <input type="password" id="confirm-password">
        <button class="password-toggle-btn" type="button" data-target="confirm-password" aria-label="Show password">👁</button>
      </div>
    </div>
    <div class="login-error" id="reset-error"></div>
    <button class="reset-submit-btn" id="reset-submit-btn" type="button">Update password</button>
  </div>

  <div class="reset-success hidden" id="reset-success">
    <div class="icon">✅</div>
    <h2>Password updated</h2>
    <p class="sub">You can now sign in with your new password.</p>
    <a href="login.html" class="reset-submit-btn" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">Go to Sign In</a>
  </div>
</div>

<script type="module" src="reset-password.js"></script>
</body>
</html>
