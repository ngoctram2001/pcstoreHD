<style>
  html { overflow-x: hidden; }
  .account-page { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  .account-signedout { text-align: center; padding: 80px 24px; }
  .account-signedout h2 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 12px; }
  .account-signedout p { color: var(--muted); margin-bottom: 24px; }
  .account-google-btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; border-radius: 10px;
    background: var(--accent); color: #fff; border: none; font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
  .account-google-btn:hover { opacity: .9; }

  .account-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; }
  .account-card h3 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; margin-bottom: 16px; }
  .account-profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .account-profile-row > div:last-child { min-width: 0; flex: 1; overflow-wrap: break-word; word-break: break-word; }
  .account-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
  .account-avatar-fallback { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
  .account-email { color: var(--muted); font-size: 13px; }

  .account-form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .account-form-row .form-group { flex: 1; min-width: 180px; }
  .account-save-btn {
    padding: 10px 22px; border-radius: 10px; background: var(--accent); color: #fff; border: none;
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .account-save-btn:hover { opacity: .9; }
  .account-save-note { font-size: 13px; color: var(--green); margin-left: 12px; display: none; }

  .order-row { display: flex; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .order-row:last-child { border-bottom: none; }
  .order-row-info { flex: 1; min-width: 0; }
  .order-row-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .order-row-meta { font-size: 12px; color: var(--muted); }
  .order-row-status {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap;
  }
  .order-row-status.pending { background: rgba(201,122,16,.15); color: var(--yellow); }
  .order-row-status.confirmed { background: rgba(30,138,90,.15); color: var(--green); }
  .order-row-status.cancelled { background: rgba(214,48,48,.15); color: var(--red); }
  .orders-empty { text-align: center; color: var(--muted); padding: 24px 0; font-size: 14px; }

  .account-signout-btn {
    padding: 9px 18px; border-radius: 10px; background: none; border: 1px solid var(--border);
    color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .account-signout-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">

    Johnny<span>PC</span>
  </a>

    <a class="nav-link" href="index.html">All Products</a>

    <a class="nav-link" href="https://www.facebook.com/codepcstore" target="_blank" rel="noopener">Facebook page</a>
    <a class="nav-link" href="privacy.html">Privacy Policy</a>
  </div>
  <div class="nav-right">
    <button class="nav-toggle" id="nav-toggle">☰</button>
    <div class="nav-account-wrap" id="nav-account-wrap">
      <button class="nav-account-btn nav-signin-btn" id="nav-account-btn" type="button" title="Account"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/></svg><span>Sign in</span></button>
      <div class="account-dropdown" id="account-dropdown"></div>
    </div>
    <button class="nav-cart-btn" id="nav-cart-btn" onclick="toggleCartDrawer()" title="Cart">
      🛒
      <span class="nav-cart-count" id="nav-cart-count" style="display:none">0</span>
    </button>
  </div>
</nav>

<!-- WISHLIST DRAWER -->
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-drawer-header">
    <h3>🛒 Cart</h3>
    <button class="wish-close-btn" onclick="toggleCartDrawer()">✕</button>
  </div>
  <div id="cart-list"></div>
</div>
<div id="cart-overlay" onclick="toggleCartDrawer()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:499"></div>

<div class="account-page" id="account-page">
